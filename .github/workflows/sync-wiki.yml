name: Sync Ideal Wiki from master Google Doc

on:
  workflow_dispatch:
  repository_dispatch:
    types: [wiki-source-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: idealwiki-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build public wiki directly from private master
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MASTER_DOC_ID: 1w8uXthXbiAuL--KCP7cq1oH4PJMa-TMRhJEE_6F4A4o
        run: |
          rm -rf _site
          python scripts/build_site.py --out _site
          python scripts/validate_public.py _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
